server:
  port: 9101
  servlet:
    context-path: /spring-ai/01-base

spring:
  application:
    name: spring-ai-base
  ai:
    openai:
      # DeepSeek 兼容 OpenAI 协议
      base-url: https://api.deepseek.com
      # 环境变量中获取 API Key，建议在运行时设置
      api-key: ${DEEPSEEK_API_KEY}
      chat:
        model: deepseek-v4-flash
        temperature: 0.7
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
